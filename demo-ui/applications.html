<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — JobPilot</title>
<link rel="stylesheet" href="styles.css">
<style>
  .app-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 32px; border-bottom: 1px solid var(--border-soft);
  }
  .app-nav .nav-links{ gap:24px; }
  .app-nav .nav-links a{ font-size:13.5px; }
  .app-nav .nav-links a.active{ color: var(--text); }

  .page-wrap{ max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 28px; }
  .page-head h1{ font-size: 26px; font-weight:800; letter-spacing:-0.01em; margin-bottom: 6px; }
  .page-head p{ color: var(--text-dim); font-size: 14px; }

  .toolbar{ display:flex; gap: 12px; margin-bottom: 20px; align-items:center; }
  .search-box{
    flex:1; max-width: 320px; display:flex; align-items:center; gap:8px;
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 9px 14px;
  }
  .search-box input{ background:none; border:none; outline:none; color: var(--text); font-size: 13.5px; width:100%; font-family: var(--font-display); }
  .search-box .ic{ color: var(--text-faint); }

  .filter-chips{ display:flex; gap: 8px; }
  .filter-chip{
    font-size: 13px; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg-panel); color: var(--text-dim); cursor:pointer; transition: all 0.15s;
    display:flex; align-items:center; gap:6px;
  }
  .filter-chip.active{ background: var(--mint-bg); border-color: var(--mint); color: var(--mint); }
  .filter-chip .count{ font-family: var(--font-mono); font-size:11px; opacity:0.8; }

  .spacer{ flex:1; }
  .date-select{ font-size:13px; color: var(--text-dim); background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius-md); padding: 9px 12px; font-family: var(--font-display); }

  .table-panel{ overflow: hidden; }
  table{ width:100%; border-collapse: collapse; }
  thead th{
    text-align:left; font-size: 11.5px; text-transform:uppercase; letter-spacing:0.04em;
    color: var(--text-faint); font-weight:600; padding: 14px 20px; border-bottom: 1px solid var(--border-soft);
    background: var(--bg-raised);
  }
  tbody td{ padding: 16px 20px; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition: background 0.15s; }
  tbody tr:hover{ background: var(--bg-raised); }
  .job-title-cell .jt{ font-weight:600; margin-bottom:2px; }
  .job-title-cell .jc{ font-size:12px; color: var(--text-faint); }
  .company-logo{ width:30px;height:30px;border-radius:7px; background: var(--bg-inset); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; font-family: var(--font-mono); flex-shrink:0; }
  .company-cell{ display:flex; align-items:center; gap:10px; }
  .date-cell{ font-family: var(--font-mono); font-size: 12.5px; color: var(--text-dim); }
  .link-cell a{ color: var(--mint); font-size:13px; font-weight:600; }

  .pagination{ display:flex; justify-content:space-between; align-items:center; padding: 16px 20px; border-top: 1px solid var(--border-soft); }
  .pagination .info{ font-size: 12.5px; color: var(--text-faint); font-family: var(--font-mono); }
  .page-btns{ display:flex; gap:6px; }
  .page-btn{ width:30px;height:30px; border-radius:7px; border:1px solid var(--border); background: var(--bg-panel); color: var(--text-dim); font-size:12.5px; display:flex;align-items:center;justify-content:center; }
  .page-btn.active{ background: var(--mint-bg); border-color: var(--mint); color: var(--mint); font-weight:700; }

  @media (max-width: 900px){
    .toolbar{ flex-wrap:wrap; }
    table{ font-size:12px; }
    thead{ display:none; }
  }
</style>
</head>
<body>

<nav class="app-nav">
  <div class="logo"><div class="logo-mark">J</div>JobPilot</div>
  <div class="nav-links">
    <a href="agent.html">Agent</a>
    <a href="applications.html" class="active">Applications</a>
    <a href="profile.html">Profile</a>
  </div>
  <div class="nav-actions">
    <div class="theme-toggle" id="themeToggle"></div>
    <div style="width:32px;height:32px;border-radius:50%;background:var(--mint);color:#08110D;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">AS</div>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-head">
    <div>
      <h1>Applications</h1>
      <p>Every job the agent has touched, with a reason for each outcome.</p>
    </div>
    <a href="agent.html" class="btn btn-primary">Start new run</a>
  </div>

  <div class="toolbar">
    <div class="search-box"><span class="ic">⌕</span><input type="text" placeholder="Search by job title or company..."></div>
    <div class="filter-chips">
      <div class="filter-chip active" data-filter="all">All <span class="count">142</span></div>
      <div class="filter-chip" data-filter="applied">Applied <span class="count">98</span></div>
      <div class="filter-chip" data-filter="skipped">Skipped <span class="count">22</span></div>
      <div class="filter-chip" data-filter="failed">Failed <span class="count">11</span></div>
      <div class="filter-chip" data-filter="rejected">Rejected <span class="count">11</span></div>
    </div>
    <div class="spacer"></div>
    <select class="date-select"><option>Last 30 days</option><option>Last 7 days</option><option>All time</option></select>
  </div>

  <div class="panel table-panel">
    <table>
      <thead>
        <tr>
          <th>Job</th>
          <th>Company</th>
          <th>Location</th>
          <th>Date applied</th>
          <th>Status</th>
          <th>Listing</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="pagination">
      <div class="info">Showing 1–10 of 142</div>
      <div class="page-btns">
        <div class="page-btn">‹</div>
        <div class="page-btn active">1</div>
        <div class="page-btn">2</div>
        <div class="page-btn">3</div>
        <div class="page-btn">›</div>
      </div>
    </div>
  </div>
</div>

<script>
  const root = document.documentElement;
  const saved = localStorage.getItem('jp-theme');
  if(saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur = root.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('jp-theme', next);
  });

  const data = [
    {title:'Senior Product Designer', sub:'Easy Apply', co:'Stripe', init:'ST', loc:'Remote', date:'Jun 17, 2026 · 6:44 PM', status:'applied'},
    {title:'Product Designer II', sub:'Easy Apply', co:'Figma', init:'FG', loc:'San Francisco (Remote)', date:'Jun 17, 2026 · 6:47 PM', status:'applied'},
    {title:'Staff Designer, Platform', sub:'Easy Apply', co:'Notion', init:'NT', loc:'Remote', date:'Jun 17, 2026 · 6:49 PM', status:'skipped', reason:'Requires 8+ yrs experience'},
    {title:'Brand & Product Designer', sub:'Easy Apply', co:'Ramp', init:'RP', loc:'New York, NY', date:'Jun 17, 2026 · 6:51 PM', status:'applied'},
    {title:'UX Researcher', sub:'Easy Apply', co:'Airbnb', init:'AB', loc:'Remote', date:'Jun 17, 2026 · 6:53 PM', status:'failed', reason:'Form error on submit'},
    {title:'Product Designer', sub:'Easy Apply', co:'Linear', init:'LN', loc:'Remote', date:'Jun 16, 2026 · 8:12 PM', status:'rejected', reason:'Rejected by company'},
    {title:'Design Lead, Growth', sub:'Easy Apply', co:'Razorpay', init:'RZ', loc:'Bengaluru', date:'Jun 16, 2026 · 8:09 PM', status:'applied'},
    {title:'Senior UX Designer', sub:'Easy Apply', co:'Zerodha', init:'ZD', loc:'Bengaluru', date:'Jun 16, 2026 · 8:05 PM', status:'applied'},
    {title:'Product Designer, Payments', sub:'Easy Apply', co:'Cred', init:'CR', loc:'Remote', date:'Jun 16, 2026 · 8:01 PM', status:'skipped', reason:'Salary below your minimum'},
    {title:'UI/UX Designer', sub:'Easy Apply', co:'Swiggy', init:'SW', loc:'Hyderabad', date:'Jun 16, 2026 · 7:58 PM', status:'applied'},
  ];

  const statusLabel = { applied:'Applied', skipped:'Skipped', failed:'Failed', rejected:'Rejected' };

  function render(filter='all'){
    const body = document.getElementById('tableBody');
    body.innerHTML = '';
    const rows = filter === 'all' ? data : data.filter(d=>d.status===filter);
    rows.forEach(d=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="job-title-cell"><div class="jt">${d.title}</div><div class="jc">${d.sub}${d.reason ? ' · '+d.reason : ''}</div></td>
        <td><div class="company-cell"><div class="company-logo">${d.init}</div>${d.co}</div></td>
        <td>${d.loc}</td>
        <td class="date-cell">${d.date}</td>
        <td><span class="badge badge-${d.status}">${statusLabel[d.status]}</span></td>
        <td class="link-cell"><a href="#">View ↗</a></td>
      `;
      body.appendChild(tr);
    });
  }
  render();

  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      render(chip.dataset.filter);
    });
  });
</script>
</body>
</html>
